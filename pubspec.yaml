  shared_preferences:
  font_awesome_flutter: ^10.1.0
  video_player:
  flutter_circle_color_picker: ^0.3.0
  flutter_keyboard_visibility: ^5.3.0
  spring: ^2.0.2
  dio:
  carousel_slider: ^5.0.0

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  firebase_messaging: ^16.4.3
  firebase_app_check: ^0.4.1+3

  path_provider: ^2.0.11
  simple_timer: ^2.0.0
  disable_battery_optimization: ^1.1.0
  webview_flutter: ^4.14.1
  google_sign_in: ^7.2.0
  image_picker:
  pin_code_fields: ^8.0.1
  delayed_display: ^2.0.0
  flutter_native_splash:
  country_picker: ^2.0.16
  flutter_image_slideshow: ^0.1.2
  declarative_refresh_indicator: ^0.1.0
  avatar_glow: ^2.0.2
  animated_text_kit:
  on_audio_query: ^2.6.0
  draggable_widget: ^2.0.0
  just_audio: ^0.9.20
  audio_video_progress_bar: ^0.10.0
  rxdart: ^0.27.3
  pusher_channels:
  purchases_flutter: ^9.0.0
  country_code_picker:
  country_list_pick: ^1.0.1+6
  tab_indicator_styler: ^2.0.0
  url_launcher:
  cached_network_image: ^3.2.0
  flutter_svg: any
  agora_rtc_engine: ^6.5.4
  permission_handler: any
  percent_indicator: 4.0.1
  filling_slider:
  zoom_pinch_overlay: ^1.3.2
  flutter_facebook_auth:
  country_calling_code_picker_plus: ^1.0.1
  flutter_smart_dialog:
  image_cropper: ^12.2.1
  banner_carousel: ^1.2.1
  wp_pivot_flutter: ^1.0.0
  motion_toast:
  flutter_svga: ^0.0.13
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_localizations:
    sdk: flutter


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/image/icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#000000"
  image: assets/image/splash_logo.png
  android_12:
    color: "#000000"
    image: assets/image/splash_logo.png

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/language/
    - assets/audios/
    - assets/raw/country_codes.json
    - flags/

  fonts:
    - family: cairo
      fonts:
        - asset: assets/font/Cairo-VariableFont_wght.ttf
          weight: 400

    - family: NotoSans
      fonts:
        - asset: assets/font/Noto-Sans-700.ttf
          weight: 400

    - family: numbers
      fonts:
        - asset: assets/font/DancingScript-Medium.ttf
          weight: 400

    - family: anton
      fonts:
        - asset: assets/font/DancingScript-Medium.ttf
          weight: 400

    - family: Metal
      fonts:
        - asset: assets/font/MetalMania-Regular.ttf
          weight: 400

    - family: Omar
      fonts:
        - asset: assets/font/Omar-Bold-1.ttf
          weight: 400

    - family: OmarR
      fonts:
        - asset: assets/font/DIN-CondensedBold.ttf
          weight: 400

    - family: Arslan
      fonts:
        - asset: assets/font/Arslan.ttf
          weight: 400

    - family: Emoji
      fonts:
        - asset: assets/font/NotoColorEmoji-Regular.ttf
          weight: 400

dependency_overrides:
  permission_handler_android: 12.0.13